version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/pg/schema.sql"
    queries: "internal/store/pg/query.sql"
    gen:
      go:
        package: "pgdb"
        out: "internal/store/pg/pgdb"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_interface: false
        emit_empty_slices: true
