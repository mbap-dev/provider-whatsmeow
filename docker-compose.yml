services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # Dedicated, isolated Postgres for the provider only. It is NOT published on
  # the host (no 5432 mapping) to avoid colliding with any other Postgres you
  # already run; the workers reach it over the compose network as "postgres".
  # If you need external access, uncomment the ports mapping (host 5433).
  postgres:
    image: postgres:16
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-whatsmeow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-whatsmeow}"
      POSTGRES_DB: "${POSTGRES_DB:-whatsmeow}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsmeow} -d ${POSTGRES_DB:-whatsmeow}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # ports:
    #   - "5433:5432"   # uncomment for host access on port 5433

  worker-a:
    build: .
    image: ghcr.io/mbap-dev/provider-whatsmeow:latest
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      POSTGRES_URL: "postgres://${POSTGRES_USER:-whatsmeow}:${POSTGRES_PASSWORD:-whatsmeow}@postgres:5432/${POSTGRES_DB:-whatsmeow}?sslmode=disable"
      AMQP_EXCHANGE: provider.whatsmeow.outgoing
      AMQP_BINDING_PREFIX: provider.whatsmeow
      AMQP_WEBHOOK_EXCHANGE: provider.whatsmeow.webhooks
      AMQP_QUEUE: outgoing.whatsmeow.main
      WORKER_ID: worker-a
      WORKER_STRICT_ASSIGNMENT: "true"
      WORKER_AUTOCONNECT_ASSIGNED: "true"
      SESSION_STORE: /var/lib/whatsmeow
      HTTP_ADDR: ":8080"
      UI_ENABLED: "true"
      UI_AUTH_ENABLED: "${UI_AUTH_ENABLED:-false}"
      UI_AUTH_USER: "${UI_AUTH_USER:-}"
      UI_AUTH_PASS: "${UI_AUTH_PASS:-}"
      UI_AUTH_REALM: "${UI_AUTH_REALM:-WhatsMeow Dashboard}"
      API_AUTH_ENABLED: "${API_AUTH_ENABLED:-false}"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-}"
      UNOAPI_AUTH_TOKEN: "${UNOAPI_AUTH_TOKEN:-}"
      API_AUTH_ALLOW_QUERY: "${API_AUTH_ALLOW_QUERY:-true}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      AUTH_SECURE_COOKIE: "${AUTH_SECURE_COOKIE:-false}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      OUTGOING_MESSAGES_COEX: "${OUTGOING_MESSAGES_COEX:-false}"
      MEDIA_STORAGE_MODE: "${MEDIA_STORAGE_MODE:-auto}"
      MEDIA_STORE_DIR: "${MEDIA_STORE_DIR:-/var/lib/whatsmeow/_media}"
      MEDIA_REGISTRY_FILE: "${MEDIA_REGISTRY_FILE:-/var/lib/whatsmeow/_media_registry.json}"
      MEDIA_URL_TTL_SECONDS: "${MEDIA_URL_TTL_SECONDS:-259200}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      S3_PREFIX: "${S3_PREFIX:-}"
      PROXY_PROTOCOL: "${PROXY_PROTOCOL:-}"
      PROXY_HOST: "${PROXY_HOST:-}"
      PROXY_PORT: "${PROXY_PORT:-}"
      PROXY_USERNAME: "${PROXY_USERNAME:-}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      WHATSMEOW_LOG_LEVEL: "${WHATSMEOW_LOG_LEVEL:-INFO}"
    volumes:
      - ./data/worker-a:/var/lib/whatsmeow
    ports:
      - "8080:8080"

  worker-b:
    profiles: ["multi-worker"]
    build: .
    image: ghcr.io/mbap-dev/provider-whatsmeow:latest
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      POSTGRES_URL: "postgres://${POSTGRES_USER:-whatsmeow}:${POSTGRES_PASSWORD:-whatsmeow}@postgres:5432/${POSTGRES_DB:-whatsmeow}?sslmode=disable"
      AMQP_EXCHANGE: provider.whatsmeow.outgoing
      AMQP_BINDING_PREFIX: provider.whatsmeow
      AMQP_WEBHOOK_EXCHANGE: provider.whatsmeow.webhooks
      AMQP_QUEUE: outgoing.whatsmeow.worker-b
      WORKER_ID: worker-b
      WORKER_NUMBERS: "${WORKER_B_NUMBERS:-}"
      WORKER_STRICT_ASSIGNMENT: "true"
      WORKER_AUTOCONNECT_ASSIGNED: "true"
      SESSION_STORE: /var/lib/whatsmeow
      HTTP_ADDR: ":8080"
      UI_ENABLED: "false"
      API_AUTH_ENABLED: "${API_AUTH_ENABLED:-false}"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-}"
      UNOAPI_AUTH_TOKEN: "${UNOAPI_AUTH_TOKEN:-}"
      API_AUTH_ALLOW_QUERY: "${API_AUTH_ALLOW_QUERY:-true}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      AUTH_SECURE_COOKIE: "${AUTH_SECURE_COOKIE:-false}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      OUTGOING_MESSAGES_COEX: "${OUTGOING_MESSAGES_COEX:-false}"
      MEDIA_STORAGE_MODE: "${MEDIA_STORAGE_MODE:-auto}"
      MEDIA_STORE_DIR: "${MEDIA_STORE_DIR:-/var/lib/whatsmeow/_media}"
      MEDIA_REGISTRY_FILE: "${MEDIA_REGISTRY_FILE:-/var/lib/whatsmeow/_media_registry.json}"
      MEDIA_URL_TTL_SECONDS: "${MEDIA_URL_TTL_SECONDS:-259200}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      S3_PREFIX: "${S3_PREFIX:-}"
      PROXY_PROTOCOL: "${PROXY_PROTOCOL:-}"
      PROXY_HOST: "${PROXY_HOST:-}"
      PROXY_PORT: "${PROXY_PORT:-}"
      PROXY_USERNAME: "${PROXY_USERNAME:-}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-}"
    volumes:
      - ./data/worker-b:/var/lib/whatsmeow
