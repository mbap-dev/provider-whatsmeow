version: "3.9"

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/letsencrypt:/letsencrypt
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth
      - traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal

  # Postgres for persistent metadata + auth (optional but recommended).
  # Set POSTGRES_URL in workers to activate. Leave POSTGRES_URL blank to use
  # file-based store and skip auth entirely.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsmeow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsmeow}
      POSTGRES_DB: ${POSTGRES_DB:-whatsmeow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsmeow} -d ${POSTGRES_DB:-whatsmeow}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  worker-a:
    image: ${PROVIDER_IMAGE}
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - postgres
    environment:
      LOG_LEVEL: ${WORKER_LOG_LEVEL}
      HTTP_ADDR: ":8080"
      SESSION_STORE: /var/lib/whatsmeow
      POSTGRES_URL: "postgres://${POSTGRES_USER:-whatsmeow}:${POSTGRES_PASSWORD:-whatsmeow}@postgres:5432/${POSTGRES_DB:-whatsmeow}?sslmode=disable"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      UI_ENABLED: "true"
      UI_TITLE: "WhatsMeow Control Center"
      UI_AUTH_ENABLED: ${UI_AUTH_ENABLED:-false}
      UI_AUTH_USER: ${UI_AUTH_USER:-}
      UI_AUTH_PASS: ${UI_AUTH_PASS:-}
      UI_AUTH_REALM: ${UI_AUTH_REALM:-WhatsMeow Dashboard}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      UNOAPI_AUTH_TOKEN: ${UNOAPI_AUTH_TOKEN:-}
      API_AUTH_ALLOW_QUERY: ${API_AUTH_ALLOW_QUERY:-true}

      MEDIA_STORAGE_MODE: ${MEDIA_STORAGE_MODE:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-}

      AMQP_CONSUMER_ENABLED: "true"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      AMQP_EXCHANGE: provider.whatsmeow.outgoing
      AMQP_BINDING_PREFIX: provider.whatsmeow
      AMQP_QUEUE: outgoing.whatsmeow.worker-a
      AMQP_WEBHOOK_EXCHANGE: provider.whatsmeow.webhooks

      WORKER_ID: worker-a
      WORKER_NUMBERS: ${WORKER_A_NUMBERS}
      WORKER_STRICT_ASSIGNMENT: "true"
      WORKER_AUTOCONNECT_ASSIGNED: "true"

      WEBHOOK_BASE: ${WEBHOOK_BASE}
      REDIS_URL: ${REDIS_URL}
      STATUS_PREFIX: provider-whatsmeow-status:
      SESSION_CONFIG_PREFIX: provider-whatsmeow-config:
    volumes:
      - worker_a_data:/var/lib/whatsmeow
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.provider.rule=Host(`${PROVIDER_HOST}`)
      - traefik.http.routers.provider.entrypoints=websecure
      - traefik.http.routers.provider.tls=true
      - traefik.http.routers.provider.tls.certresolver=letsencrypt
      - traefik.http.services.provider.loadbalancer.server.port=8080

  worker-b:
    image: ${PROVIDER_IMAGE}
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - postgres
    environment:
      LOG_LEVEL: ${WORKER_LOG_LEVEL}
      HTTP_ADDR: ":8080"
      SESSION_STORE: /var/lib/whatsmeow
      POSTGRES_URL: "postgres://${POSTGRES_USER:-whatsmeow}:${POSTGRES_PASSWORD:-whatsmeow}@postgres:5432/${POSTGRES_DB:-whatsmeow}?sslmode=disable"
      UI_ENABLED: "false"
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      UNOAPI_AUTH_TOKEN: ${UNOAPI_AUTH_TOKEN:-}
      API_AUTH_ALLOW_QUERY: ${API_AUTH_ALLOW_QUERY:-true}

      MEDIA_STORAGE_MODE: ${MEDIA_STORAGE_MODE:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-}

      AMQP_CONSUMER_ENABLED: "true"
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      AMQP_EXCHANGE: provider.whatsmeow.outgoing
      AMQP_BINDING_PREFIX: provider.whatsmeow
      AMQP_QUEUE: outgoing.whatsmeow.worker-b
      AMQP_WEBHOOK_EXCHANGE: provider.whatsmeow.webhooks

      WORKER_ID: worker-b
      WORKER_NUMBERS: ${WORKER_B_NUMBERS}
      WORKER_STRICT_ASSIGNMENT: "true"
      WORKER_AUTOCONNECT_ASSIGNED: "true"

      WEBHOOK_BASE: ${WEBHOOK_BASE}
      REDIS_URL: ${REDIS_URL}
      STATUS_PREFIX: provider-whatsmeow-status:
      SESSION_CONFIG_PREFIX: provider-whatsmeow-config:
    volumes:
      - worker_b_data:/var/lib/whatsmeow
    networks:
      - internal

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data:
  worker_a_data:
  worker_b_data:
